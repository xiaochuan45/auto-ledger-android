name: Android verification

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Draft release tag: verify its exact signed APKs; blank runs ordinary source checks'
        required: false
        default: ''
        type: string
      certificate_sha256:
        description: 'Public signing certificate SHA-256 fingerprint; required for a draft release verification'
        required: false
        default: ''
        type: string
      delivery_ref:
        description: 'Optional exact 40-character commit SHA containing only the four staged delivery files'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.ref }}-${{ inputs.release_tag || 'source' }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source tests and APK audit (API ${{ matrix.api }})
    if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '11076708'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install compile SDK and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run unit tests, build both variants, and lint
        run: |
          python3 scripts/test_verify_apk.py
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug lintDebug assembleRelease

      - name: Audit debug and unsigned release APKs
        run: |
          python3 scripts/verify_apk.py --apk app/build/outputs/apk/debug/app-debug.apk --output-dir evidence/debug --build-type debug
          python3 scripts/verify_apk.py --apk app/build/outputs/apk/release/app-release-unsigned.apk --output-dir evidence/release --build-type release --unsigned

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Room, permission, and UI tests on Android API ${{ matrix.api }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=io.github.xiaochuan45.autoledger.data.UpgradePersistenceTest

      - name: Upload audit evidence and test reports (no debug APK publication)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-verification-api${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 30

  verify_delivery:
    name: Verify exact signed delivery and update (API 35)
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # GitHub draft releases require a repository identity with push access.
    # This job may stage signed files in a draft and verifies them; publication is separate.
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '11076708'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install audit tools
        run: sdkmanager 'build-tools;35.0.0'

      - name: Validate dispatch inputs against the main checkout's public certificate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CERTIFICATE_SHA256: ${{ inputs.certificate_sha256 }}
          DELIVERY_REF: ${{ inputs.delivery_ref }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,100}$ ]] || { echo 'Invalid release tag'; exit 1; }
          [[ "$CERTIFICATE_SHA256" =~ ^[0-9a-fA-F:]{64,95}$ ]] || { echo 'A public certificate fingerprint is required'; exit 1; }
          normalized_certificate="${CERTIFICATE_SHA256//:/}"
          normalized_certificate="${normalized_certificate,,}"
          public_pin="$(tr -d '[:space:]' < config/signing-certificate.sha256)"
          [[ "$public_pin" =~ ^[0-9a-f]{64}$ && "$normalized_certificate" == "$public_pin" ]] || { echo 'Certificate does not match the main checkout public pin'; exit 1; }
          [[ -z "$DELIVERY_REF" || "$DELIVERY_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'delivery_ref must be an exact 40-character commit SHA'; exit 1; }

      - name: Check out signed delivery files separately from the main scripts
        if: inputs.delivery_ref != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.delivery_ref }}
          path: staging
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Audit and upload only the four staged files to the existing draft
        if: inputs.delivery_ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CERTIFICATE_SHA256: ${{ inputs.certificate_sha256 }}
        run: |
          [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]] || { echo 'Staging upload requires an existing draft release'; exit 1; }
          mkdir staged-delivery
          for name in auto-ledger-prototype.apk auto-ledger-prototype.apk.sha256 verification-instrumentation.apk verification-previous.apk; do
            [[ -f "staging/$name" && ! -L "staging/$name" ]] || { echo "Invalid staging file: $name"; exit 1; }
            cp -- "staging/$name" "staged-delivery/$name"
          done
          python3 scripts/verify_delivery_signatures.py --directory staged-delivery --expected-cert-sha256 "$CERTIFICATE_SHA256"
          python3 scripts/verify_apk.py --apk staged-delivery/auto-ledger-prototype.apk --output-dir staged-delivery/audit --build-type release --expected-cert-sha256 "$CERTIFICATE_SHA256"
          python3 scripts/verify_apk.py --apk staged-delivery/verification-previous.apk --output-dir staged-delivery/previous-audit --build-type release --release-role previous --expected-cert-sha256 "$CERTIFICATE_SHA256"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            staged-delivery/auto-ledger-prototype.apk \
            staged-delivery/auto-ledger-prototype.apk.sha256 \
            staged-delivery/verification-instrumentation.apk \
            staged-delivery/verification-previous.apk

      - name: Download and audit the draft's exact signed APKs (without rebuilding)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CERTIFICATE_SHA256: ${{ inputs.certificate_sha256 }}
        run: |
          mkdir -p delivery
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir delivery \
            --pattern auto-ledger-prototype.apk \
            --pattern auto-ledger-prototype.apk.sha256 \
            --pattern verification-instrumentation.apk \
            --pattern verification-previous.apk
          python3 scripts/verify_delivery_signatures.py --directory delivery --expected-cert-sha256 "$CERTIFICATE_SHA256"
          python3 scripts/verify_apk.py --apk delivery/auto-ledger-prototype.apk --output-dir delivery/audit --build-type release --expected-cert-sha256 "$CERTIFICATE_SHA256"
          python3 scripts/verify_apk.py --apk delivery/verification-previous.apk --output-dir delivery/previous-audit --build-type release --release-role previous --expected-cert-sha256 "$CERTIFICATE_SHA256"

      - name: Confirm uploaded and downloaded staging files have identical bytes
        if: inputs.delivery_ref != ''
        run: |
          for name in auto-ledger-prototype.apk auto-ledger-prototype.apk.sha256 verification-instrumentation.apk verification-previous.apk; do
            cmp -- "staged-delivery/$name" "delivery/$name"
          done

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test the actual signed delivery APK and retain data across an update
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/verify_delivery.sh delivery

      - name: Confirm the delivery bytes remain identical
        run: |
          (cd delivery && sha256sum --check auto-ledger-prototype.apk.sha256)
          echo 'The signed APK was tested without rebuilding. Publication remains a separate action.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed delivery verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-delivery-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            delivery/audit/
            delivery/previous-audit/
            delivery/delivery-signatures.json
            delivery/emulator-results/
            staged-delivery/audit/
            staged-delivery/previous-audit/
            staged-delivery/delivery-signatures.json
          if-no-files-found: warn
          retention-days: 30
