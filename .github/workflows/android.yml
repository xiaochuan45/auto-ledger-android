name: Android preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, audit, and emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      apk_artifact_id: ${{ steps.upload_apk.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install compile SDK and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build preview and run Android lint
        run: ./gradlew --no-daemon --stacktrace assembleDebug lintDebug

      - name: Audit the actual installable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/auto-ledger-preview.apk
          python3 scripts/verify_apk.py --apk dist/auto-ledger-preview.apk --output-dir dist

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run launch and navigation tests on Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Confirm the tested build still matches the audited APK
        run: |
          cmp app/build/outputs/apk/debug/app-debug.apk dist/auto-ledger-preview.apk
          cd dist
          sha256sum --check auto-ledger-preview.apk.sha256

      - name: Upload verified APK and audit evidence
        id: upload_apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint and emulator test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish install-only prerelease
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download verified files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.apk_artifact_id }}
          merge-multiple: true
          path: dist

      - name: Publish APK, checksum, and permission audit
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: preview-${{ github.run_id }}-${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd dist
          sha256sum --check auto-ledger-preview.apk.sha256
          cd ..
          cp docs/RELEASE_PREVIEW.md "$RUNNER_TEMP/release-notes.md"
          printf '\n\n源代码：`%s`\n\n云端验证记录：%s\n' "$GITHUB_SHA" "$RUN_URL" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$PREVIEW_TAG" \
            dist/auto-ledger-preview.apk \
            dist/auto-ledger-preview.apk.sha256 \
            dist/permissions-audit.md \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "本地账本 · 安装预览 $PREVIEW_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
